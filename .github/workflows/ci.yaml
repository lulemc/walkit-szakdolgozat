name: CI
on:
  pull_request:
  push:
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    
    # Add MongoDB service
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run backend tests
        env:
          MONGO_URI: mongodb://localhost:27017/walkit_test
          JWT_SECRET: test_jwt_secret_key_for_ci
          ORS_API_KEY: mock_ors_key_for_testing
          NODE_ENV: test
        run: npm run test:run
  
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run frontend tests
        run: npm run test:ci
