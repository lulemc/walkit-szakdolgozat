# Render blueprint for the WalkIt API: Dashboard > New > Blueprint, pick this repo.
# The database is MongoDB Atlas (free M0 cluster); paste its connection string
# into MONGO_URI when Render asks. Values marked sync: false are asked once.
services:
  - type: web
    name: walkit-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render runs one proxy in front of the service
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ORS_API_KEY
        sync: false
      # Only needed for the web app; the mobile app sends no origin
      - key: CORS_ORIGINS
        sync: false
